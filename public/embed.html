<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>EventMedium — Upcoming Events</title>
<!-- Iframe-embeddable event list:
     <iframe src="https://www.eventmedium.ai/embed.html?theme=AI&city=London&limit=5"
             width="420" height="480" frameborder="0"></iframe> -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#fff; }
</style>
</head>
<body>
<script>
  // Reuse the widget renderer, parameterized from our own query string.
  (function() {
    var p = new URLSearchParams(window.location.search);
    var s = document.createElement('script');
    s.src = '/widget.js';
    if (p.get('theme')) s.setAttribute('data-theme', p.get('theme'));
    if (p.get('city')) s.setAttribute('data-city', p.get('city'));
    if (p.get('region')) s.setAttribute('data-region', p.get('region'));
    if (p.get('limit')) s.setAttribute('data-limit', p.get('limit'));
    if (p.get('title')) s.setAttribute('data-title', p.get('title'));
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
